# ============================================================
#  MethylongAgent configuration
#  Edit and restart the app to apply changes.
#
#  Start command:
#    streamlit run ui/app_ui.py
# ============================================================

# ── LLM model ─────────────────────────────────────────────────────────────────
llm:
  # Model to use — must have a matching entry in model_paths
  # Options: qwen3_14B | qwen35_27B | qwen3_8B | openai_compatible
  model_name: qwen3_14B

  # Inference device
  # Examples: cuda:0  cuda:1  auto  cpu
  device: cuda:0

  # Local model paths (absolute paths)
  model_paths:
    qwen3_14B: /ni_data/users/shengtao/model/qwen3-14b/models--Qwen--Qwen3-14B/snapshots/40c069824f4251a91eefaf281ebe4c544efd3e18/
    embedding:  /ni_data/users/shengtao/model/all-MiniLM-L6-v2
    reranker:   /ni_data/users/shengtao/model/bge-reranker-base/models--BAAI--bge-reranker-base/snapshots/2cfc18c9415c912f9d8155881c133215df768a70/

# ── Tool execution environment ────────────────────────────────────────────────
tools:
  # Execution environment for bio tools when no Singularity image is found
  #
  # type: conda   → activates the named conda environment before running
  # type: script  → bash <script_path> "<cmd>"
  # type: null    → run in current shell environment
  exec_env:
    type: conda
    env_name: sin

# ── Data and model directories ─────────────────────────────────────────────────
data:
  # Root directory for uploaded files and run results (~ supported)
  agent_data:      ~/agent_data
  nfcore_home:     ~/.nextflow     # Nextflow plugin/cache directory
  nextflow_offline: true           # Set true on air-gapped servers (plugins must be pre-cached)

  # Dorado model directory (used by methylong pipeline)
  dorado_models: ~/tools/dorado_model/

  # Pod5 sampling rate for automatic Dorado model version selection
  # 4000 → older R10.4.1 chemistry (v4.x.x models)
  # 5000 → newer R10.4.1 chemistry (v5.x.x models)
  dorado_sample_rate: 4000

  # Singularity image directory
  singularity_image_dir: ~/singularity_image

  # Directory for local Nextflow pipelines (each subdirectory = one pipeline)
  pipeline_dir: ~/agent_workflow/

  # Per-user storage quota in GB
  user_quota_gb: 100

# ── User accounts ──────────────────────────────────────────────────────────────
# Only written to DB on first start — later changes go through the UI or admin API
# Format:  username: password
users:
  admin: admin2026

# ── Nextflow workflow ──────────────────────────────────────────────────────────
workflow:
  # Nextflow run profile
  # Common values: singularity | docker | conda
  profile: singularity

  # Resource limits (prevent individual processes from exceeding available capacity)
  max_memory: "30.GB"
  max_time:   "72.h"
  max_cpus:   null   # null = auto-detect CPU count

# ── Web server ─────────────────────────────────────────────────────────────────
server:
  port:             50025
  address:          "0.0.0.0"
  max_upload_mb:    10240    # Max upload size per file in MB
  file_server_port: 50028    # Fast file-download server port (must differ from Streamlit port)

# ── UI language ────────────────────────────────────────────────────────────────
# en_US | zh_CN
language: en_US
