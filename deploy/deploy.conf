# =============================================================================
#  MethylongAgent deployment configuration
#  Copy this file, edit for your environment, then run deploy.sh
# =============================================================================

# Root directory for all data files. Leave empty to use $HOME.
BASE_DIR=""

# Conda env for running Nextflow + Singularity/Apptainer
SIN_ENV="sin"

# Conda env for the agent Python application
AGENT_ENV="methylong_agent"

# Python version used when creating the agent env
PYTHON_VERSION="3.10"

# ── PyTorch / CUDA ────────────────────────────────────────────────────────────
# CUDA version for the torch wheel. Must match the server's CUDA Toolkit.
# Options: cu118 (CUDA 11.8) | cu121 (CUDA 12.1) | cu124 (CUDA 12.4) | cpu
# Check server CUDA version: nvidia-smi (top-right) or nvcc --version
CUDA_VERSION="cu118"

# ── Singularity images ────────────────────────────────────────────────────────
# Image list is hard-coded in deploy/03_pull_images.sh — no config needed here.

# ── Dorado models ─────────────────────────────────────────────────────────────
# Pod5 sample rate used for model selection at runtime (5000 = v5.x models)
DORADO_SAMPLE_RATE=5000

# Models downloaded are fixed to v5.2.0 (see deploy/05_pull_dorado_models.sh):
#   dna_r10.4.1_e8.2_400bps_sup@v5.2.0
#   dna_r10.4.1_e8.2_400bps_sup@v5.2.0_5mC_5hmC@v2

# ── LLM configuration ─────────────────────────────────────────────────────────
# LLM run mode: local (on-device inference) or api (OpenAI-compatible endpoint)
LLM_MODE="local"

# ── Local LLM (applies when LLM_MODE=local) ──────────────────────────────────
# model_name field written to config.yaml
LLM_MODEL_NAME="qwen3_14B"

# Inference device, e.g. cuda:0 / cuda:1 / cpu
LLM_DEVICE="cuda:0"

# HuggingFace endpoint (leave empty for official; falls back to hf-mirror.com on failure)
HF_ENDPOINT=""

# Models downloaded (see deploy/06_download_llm.sh):
#   LLM:       Qwen/Qwen3-14B                           → {BASE_DIR}/models/qwen3-14b/
#   Embedding: sentence-transformers/all-MiniLM-L6-v2   → {BASE_DIR}/models/all-MiniLM-L6-v2/
#   Reranker:  BAAI/bge-reranker-base                   → {BASE_DIR}/models/bge-reranker-base/

# ── API mode (applies when LLM_MODE=api) ─────────────────────────────────────
# OpenAI-compatible API base URL
API_BASE_URL="https://api.deepseek.com/v1"

# API key (written to configs/secrets.py — never commit that file)
API_KEY=""

# Model name sent in API requests
API_MODEL="deepseek-chat"

# ── Server ────────────────────────────────────────────────────────────────────
SERVER_PORT=50027
USER_QUOTA_GB=10

# ── Nextflow resource limits ──────────────────────────────────────────────────
NF_MAX_MEMORY="30.GB"
NF_MAX_TIME="72.h"
NF_MAX_CPUS=""   # leave empty for auto-detect

# ── methylong pipeline source ─────────────────────────────────────────────────
# Git clone URL. If set, the pipeline is cloned to {BASE_DIR}/agent_workflow/methylong/.
# Leave empty to place the pipeline manually.
METHYLONG_PIPELINE_REPO=""

# Branch or tag to check out. Leave empty for the default branch.
METHYLONG_PIPELINE_REF=""
